[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-analytics"
version = "1.0.0"
description = "End-to-end marketplace analytics: ETL, SQLite, cohort retention, RFM, delivery insights and Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "plotly>=5.18,<7",
    "streamlit>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jupyterlab>=4,<5", "nbformat>=5,<6", "matplotlib>=3.7,<4"]

[project.scripts]
marketplace-build = "marketplace_analytics.etl:main"
marketplace-demo = "marketplace_analytics.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
